
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087fa8">
<title>ILMO Health | صيدليتي</title>

<style>
:root {
  --blue: #087fa8;
  --cyan: #20b8d5;
  --pale: #eaf9ff;
  --ink: #173b4a;
  --muted: #6b8792;
  --line: #d9edf3;
  --white: #fff;
  --shadow: 0 10px 28px rgba(8,127,168,.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: linear-gradient(180deg,#effbff 0,#fff 310px);
  color: var(--ink);
  font-family: Tahoma, Arial, sans-serif;
  min-height: 100vh;
}

button {
  font: inherit;
  cursor: pointer;
}

.app {
  max-width: 760px;
  margin: 0 auto;
  padding: 18px 16px 30px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 25px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 52px;
  height: 52px;
  border-radius: 17px;
  background: linear-gradient(145deg,var(--blue),var(--cyan));
  display: grid;
  place-items: center;
  color: white;
  box-shadow: 0 8px 18px #087fa833;
}

.logo svg {
  width: 30px;
  height: 30px;
}

.brand h1 {
  font-size: 20px;
  margin: 0 0 4px;
  font-weight: 800;
}

.brand p {
  font-size: 12px;
  margin: 0;
  color: var(--muted);
}

.lang {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--blue);
  border-radius: 12px;
  padding: 9px 12px;
  font-size: 12px;
}

.welcome {
  padding: 24px 21px;
  border-radius: 25px;
  background: linear-gradient(120deg,#087fa8,#20b8d5);
  color: #fff;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
  margin-bottom: 27px;
}

.welcome:after {
  content: "+";
  position: absolute;
  left: 17px;
  top: -32px;
  font-size: 150px;
  font-weight: 200;
  color: #ffffff20;
  line-height: 1;
}

.welcome .eyebrow {
  font-size: 12px;
  opacity: .88;
  margin-bottom: 9px;
}

.welcome h2 {
  font-size: 25px;
  line-height: 1.5;
  margin: 0 0 8px;
  max-width: 430px;
}

.welcome p {
  font-size: 13px;
  line-height: 1.9;
  margin: 0;
  max-width: 440px;
  color: #e9fbff;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin: 0 2px 13px;
  gap: 10px;
}

.section-head h3 {
  font-size: 17px;
  margin: 0;
}

.section-head span {
  font-size: 11px;
  color: var(--muted);
}

.menu {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
}

.tile {
  min-height: 145px;
  text-align: right;
  border: 1px solid var(--line);
  border-radius: 21px;
  background: var(--white);
  padding: 17px 15px;
  color: var(--ink);
  box-shadow: 0 5px 16px #17495b08;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  transition: transform .16s,border-color .16s;
}

.tile:active {
  transform: scale(.985);
}

.tile:hover {
  border-color: #8ed9e9;
}

.tile .icon {
  width: 47px;
  height: 47px;
  border-radius: 15px;
  background: var(--pale);
  display: grid;
  place-items: center;
  color: var(--blue);
  margin-bottom: 13px;
}

.tile .icon svg {
  width: 25px;
  height: 25px;
  stroke: currentColor;
}

.tile strong {
  font-size: 15px;
  margin-bottom: 6px;
}

.tile small {
  font-size: 11px;
  line-height: 1.8;
  color: var(--muted);
}

.tile.study {
  grid-column: 1/-1;
  min-height: 125px;
  flex-direction: row;
  align-items: center;
  gap: 15px;
  background: linear-gradient(115deg,#fff,#f1fbff);
}

.tile.study .icon {
  flex-shrink: 0;
  margin: 0;
  width: 56px;
  height: 56px;
}

.tile.study .copy {
  display: flex;
  flex-direction: column;
}

.footer {
  text-align: center;
  color: #8aa1aa;
  font-size: 11px;
  margin-top: 25px;
  line-height: 1.8;
}

.notice {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  background: #fff8e8;
  border: 1px solid #f5dfad;
  border-radius: 12px;
  color: #795b20;
  font-size: 12px;
  line-height: 1.8;
}

@media (min-width:600px) {
  .app {
    padding: 28px 24px;
  }

  .menu {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }

  .tile.study {
    grid-column: span 2;
    min-height: 145px;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
  }

  .tile.study .icon {
    margin-bottom: 13px;
  }

  .welcome {
    padding: 30px;
  }

  .welcome h2 {
    font-size: 29px;
  }
}
</style>
</head>

<body>
<main class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>

      <div>
        <h1>ILMO Health</h1>
        <p>صيدليتي · تعلّم، طبّق، وتقدّم</p>
      </div>
    </div>

    <button class="lang" type="button" id="langBtn">
      AR · العربية
    </button>
  </header>

  <section class="welcome">
    <div class="eyebrow" id="welcomeEyebrow">
      منصتك التعليمية الصيدلانية
    </div>

    <h2 id="welcomeTitle">
      خلّي علمك الدوائي أقوى، خطوة بخطوة.
    </h2>

    <p id="welcomeText">
      تعلّم الأدوية، حلّ الحالات السريرية،
      وراجع المصادر العلمية في مكان واحد.
    </p>
  </section>

  <div class="section-head">
    <h3 id="sectionsTitle">أقسام التطبيق</h3>
    <span id="sectionsHint">اختَر القسم للبدء</span>
  </div>

  <nav class="menu" aria-label="أقسام التطبيق">

    <button class="tile" data-page="drugs.html" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none"
          stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M10.5 3.5a5 5 0 0 1 7.1 0l2.9 2.9a5 5 0 0 1-7.1 7.1l-2.9-2.9a5 5 0 0 1 0-7.1Z"/>
          <path d="m9.2 14.8-2.1 2.1a3.8 3.8 0 0 1-5.4-5.4l4.1-4.1a3.8 3.8 0 0 1 5.4 0"/>
          <path d="m8 8 8 8"/>
        </svg>
      </span>
      <strong data-ar="الأدوية" data-en="Medicines">الأدوية</strong>
      <small data-ar="معلومات دوائية، الاستعمالات والتحذيرات"
        data-en="Drug information, uses and precautions">
        معلومات دوائية، الاستعمالات والتحذيرات
      </small>
    </button>

    <button class="tile" data-page="cases.html" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none"
          stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M8 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/>
          <rect x="8" y="2" width="8" height="4" rx="1"/>
          <path d="m8 13 2.5 2.5L16 10"/>
        </svg>
      </span>
      <strong data-ar="الكيسات السريرية" data-en="Clinical Cases">الكيسات السريرية</strong>
      <small data-ar="حالات تدريبية من المبتدئ إلى المتقدم"
        data-en="Practice cases from beginner to advanced">
        حالات تدريبية من المبتدئ إلى المتقدم
      </small>
    </button>

    <button class="tile" data-page="sources.html" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none"
          stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>
          <path d="M8 7h8M8 11h8"/>
        </svg>
      </span>
      <strong data-ar="المصادر" data-en="References">المصادر</strong>
      <small data-ar="مراجع ومواقع طبية وصيدلانية موثوقة"
        data-en="Trusted medical and pharmaceutical references">
        مراجع ومواقع طبية وصيدلانية موثوقة
      </small>
    </button>

    <button class="tile" data-page="progress.html" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none"
          stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 3v18h18"/>
          <path d="m7 14 4-4 4 3 6-7"/>
          <path d="M17 6h4v4"/>
        </svg>
      </span>
      <strong data-ar="التقدم" data-en="Progress">التقدم</strong>
      <small data-ar="تابع نقاطك وإجاباتك وإنجازك الدراسي"
        data-en="Track your points, answers and learning">
        تابع نقاطك وإجاباتك وإنجازك الدراسي
      </small>
    </button>

    <button class="tile study" data-page="study.html" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none"
          stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M2 5.5A2.5 2.5 0 0 1 4.5 3H12v18H4.5A2.5 2.5 0 0 0 2 23Z" transform="translate(0 -1)"/>
          <path d="M22 5.5A2.5 2.5 0 0 0 19.5 3H12v18h7.5a2.5 2.5 0 0 1 2.5 2Z" transform="translate(0 -1)"/>
          <path d="M5 7h3M5 11h3M16 7h3M16 11h3"/>
        </svg>
      </span>
      <span class="copy">
        <strong data-ar="المادة العلمية" data-en="Study Library">المادة العلمية</strong>
        <small data-ar="فارماكولوجي، علم الأدوية، السموم، التداخلات والصيدلة السريرية"
          data-en="Pharmacology, toxicology, drug interactions and clinical pharmacy">
          فارماكولوجي، علم الأدوية، السموم، التداخلات والصيدلة السريرية
        </small>
      </span>
    </button>

  </nav>

  <div class="notice" id="notice" role="status"></div>

  <footer class="footer">
    ILMO Health<br>
    منصة تعليمية للطلبة والممارسين الصحيين
  </footer>

</main>

<script>
const translations = {
  ar: {
    eyebrow: "منصتك التعليمية الصيدلانية",
    title: "خلّي علمك الدوائي أقوى، خطوة بخطوة.",
    text: "تعلّم الأدوية، حلّ الحالات السريرية، وراجع المصادر العلمية في مكان واحد.",
    sections: "أقسام التطبيق",
    hint: "اختَر القسم للبدء",
    lang: "AR · العربية",
    missing: "هذا القسم قيد التجهيز. سنربطه بملفه المستقل بالخطوة التالية."
  },

  en: {
    eyebrow: "Your pharmaceutical learning platform",
    title: "Build your pharmaceutical knowledge, one step at a time.",
    text: "Study medicines, solve clinical cases, and explore scientific references in one place.",
    sections: "App Sections",
    hint: "Choose a section to begin",
    lang: "EN · English",
    missing: "This section is being prepared. We will connect its separate file in the next step."
  }
};

let currentLang = "ar";

const langBtn = document.getElementById("langBtn");

langBtn.addEventListener("click", () => {
  currentLang = currentLang === "ar" ? "en" : "ar";

  document.documentElement.lang = currentLang;
  document.documentElement.dir =
    currentLang === "ar" ? "rtl" : "ltr";

  const t = translations[currentLang];

  document.getElementById("welcomeEyebrow").textContent = t.eyebrow;
  document.getElementById("welcomeTitle").textContent = t.title;
  document.getElementById("welcomeText").textContent = t.text;
  document.getElementById("sectionsTitle").textContent = t.sections;
  document.getElementById("sectionsHint").textContent = t.hint;

  langBtn.textContent = t.lang;

  document.querySelectorAll("[data-ar][data-en]").forEach(el => {
    el.textContent = el.dataset[currentLang];
  });
});

document.querySelectorAll("[data-page]").forEach(btn => {
  btn.addEventListener("click", () => {
    const page = btn.dataset.page;

    fetch(page, { method: "HEAD" })
      .then(response => {
        if (response.ok) {
          window.location.href = page;
        } else {
          showNotice(translations[currentLang].missing);
        }
      })
      .catch(() => {
        showNotice(translations[currentLang].missing);
      });
  });
});

function showNotice(message) {
  const notice = document.getElementById("notice");
  notice.textContent = message;
  notice.style.display = "block";
}
</script>

</body>
</html>
